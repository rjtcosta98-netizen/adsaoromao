[build]
  publish = "dist"
  command = "pnpm run build"

# Cache-busting para assets com hash (JS, CSS gerados pelo Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache longo para imagens locais
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# HTML sem cache para garantir que a última versão é sempre entregue
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[edge_functions]]
  path = "/noticias/*"
  function = "og-news"

[[edge_functions]]
  path = "/api/vote-player"
  function = "vote-player"
